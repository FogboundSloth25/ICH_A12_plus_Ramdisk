name: Build iPhone XS A12 Ramdisk

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: "iOS version or Build ID"
        required: true
        default: "20F75"
        type: string
      kernel:
        description: "Kernel patch mode"
        required: true
        default: "patched"
        type: choice
        options:
          - patched
          - stock
      with_fw:
        description: "Include coprocessor firmware"
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -e
          echo "============================================"
          echo " iPhone XS / iPhone11,2 Ramdisk Builder"
          echo "============================================"
          sw_vers
          uname -m
          echo "ProductType : iPhone11,2"
          echo "Device      : iPhone XS"
          echo "BoardConfig : D321AP"
          echo "Platform    : t8020"
          echo "CPID        : 0x8020"
          echo "iOS         : ${{ github.event.inputs.ios_version }}"

      - name: Install system dependencies
        run: |
          set -e
          brew untap aws/tap || true
          brew update
          brew install ipsw curl python@3 libpng
          which ipsw
          which python3
          ipsw version || true
          python3 --version
          echo "LIBPNG_PREFIX=$(brew --prefix libpng)" >> "$GITHUB_ENV"

      - name: Setup Python venv
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pyimg4 capstone pillow
          fi
          python - <<'PY'
          import pyimg4
          import capstone
          from PIL import Image
          print("OK: pyimg4")
          print("OK: capstone")
          print("OK: pillow")
          PY
          echo "VENV_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify repository structure
        run: |
          set -e
          for f in \
            build.sh \
            env.sh \
            scripts/devices.sh \
            scripts/ramdisk_expand.sh \
            patch/iboot_patchfinder.py \
            patch/apply_kernel_patches.py \
            patch/finalize_iboot.py \
            patch/preflight.py
          do
            [[ -f "$f" ]] || { echo "MISS: $f"; exit 1; }
            echo "OK: $f"
          done
          for r in \
            resources/IM4M_0x8020 \
            resources/ssh.tar.gz \
            resources/sshtarlist.txt
          do
            [[ -f "$r" ]] || { echo "MISS: $r"; exit 1; }
            echo "OK: $r"
          done
          chmod +x tools/darwin/*
          for t in pzb img4 gtar trustcache jq; do
            [[ -x "tools/darwin/$t" ]] || { echo "MISS: tools/darwin/$t"; exit 1; }
            echo "OK: $t"
          done
          [[ -x tools/darwin/irecovery ]] || { echo "MISS: tools/darwin/irecovery"; exit 1; }

      - name: Patch build.sh DeviceClass matching
        run: |
          set -e
          cp build.sh build.sh.bak
          python3 <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          content = p.read_text()
          orig = 'if item.get("Info", {}).get("DeviceClass") == board'
          repl = 'if item.get("Info", {}).get("DeviceClass", "").lower() == board.lower()'
          if orig in content:
              p.write_text(content.replace(orig, repl))
              print("Patched DeviceClass comparison")
          else:
              print("DeviceClass pattern not found; leaving build.sh unchanged")
          PY
          diff -u build.sh.bak build.sh || true

      - name: Patch env.sh for CI Python
        run: |
          set -e
          cp env.sh env.sh.bak
          python3 <<'PY'
          from pathlib import Path
          p = Path("env.sh")
          content = p.read_text()
          orig = 'export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          repl = 'export PATH="${VIRTUAL_ENV:+$VIRTUAL_ENV/bin:}/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          if orig in content:
              p.write_text(content.replace(orig, repl))
              print("env.sh patched")
          else:
              print("env.sh PATH pattern not found; leaving env.sh unchanged")
          PY
          diff -u env.sh.bak env.sh || true

      - name: Replace irecovery with iPhone XS CI shim
        run: |
          set -e
          mv tools/darwin/irecovery tools/darwin/irecovery.stock
          cat > tools/darwin/irecovery <<'SHIM'
          #!/bin/bash
          if [[ "$1" == "-q" ]]; then
            cat <<'INNER'
          PRODUCT: iPhone11,2
          MODEL: D321AP
          CPID: 0x8020
          MODE: DFU
          PWND: usbliter8
          ECID: 0000000000000000
          NAME: iPhone XS
          INNER
            exit 0
          fi
          echo "irecovery CI shim: unsupported arguments: $*" >&2
          exit 1
          SHIM
          chmod +x tools/darwin/irecovery
          tools/darwin/irecovery -q

      - name: Inspect iOS 16.5.1 BuildManifest
        run: |
          set +e
          source .venv/bin/activate
          mkdir -p /tmp/buildmanifest
          cd /tmp/buildmanifest
          ipsw download ipsw \
            --device iPhone11,2 \
            --build "${{ github.event.inputs.ios_version }}" \
            --build-manifest \
            --output .
          if [[ -f BuildManifest.plist ]]; then
            python3 <<'PY'
          import plistlib
          from pathlib import Path
          data = plistlib.loads(Path("BuildManifest.plist").read_bytes())
          for i, identity in enumerate(data.get("BuildIdentities", [])):
              info = identity.get("Info", {})
              print(
                  f"Index {i}: "
                  f"DeviceClass={info.get('DeviceClass', 'N/A')} "
                  f"ProductType={info.get('ProductType', 'N/A')} "
                  f"BoardConfig={info.get('BoardConfig', 'N/A')} "
                  f"BuildNumber={info.get('BuildNumber', 'N/A')} "
                  f"RestoreBehavior={info.get('RestoreBehavior', 'N/A')}"
              )
          PY
          else
            echo "WARNING: BuildManifest.plist was not downloaded"
          fi
          cd -

      - name: Build iPhone XS A12 ramdisk
        run: |
          set -e
          source .venv/bin/activate
          export PATH="$(pwd)/.venv/bin:$PATH"
          export DYLD_LIBRARY_PATH="$(brew --prefix libpng)/lib:${DYLD_LIBRARY_PATH:-}"
          echo "============================================"
          echo " Building iPhone XS ramdisk"
          echo "============================================"
          echo "Device      : iPhone XS"
          echo "ProductType : iPhone11,2"
          echo "BoardConfig : D321AP"
          echo "Platform    : t8020"
          echo "CPID        : 0x8020"
          echo "Build       : ${{ github.event.inputs.ios_version }}"
          echo "Kernel      : ${{ github.event.inputs.kernel }}"
          echo "With FW     : ${{ github.event.inputs.with_fw }}"
          ARGS=(
            "--device" "iPhone11,2"
            "--build" "${{ github.event.inputs.ios_version }}"
            "--kernel" "${{ github.event.inputs.kernel }}"
          )
          if [[ "${{ github.event.inputs.with_fw }}" == "true" ]]; then
            ARGS+=("--with-fw")
          else
            ARGS+=("--no-fw")
          fi
          ./build.sh "${ARGS[@]}"

      - name: Inspect bootchain
        run: |
          set -e
          find bootchain -maxdepth 2 -type f -print
          du -ah bootchain
          find bootchain -name chain.info -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true

      - name: Verify A12 bootchain
        run: |
          set -e
          BOOTCHAIN_DIR="$(find bootchain -mindepth 1 -maxdepth 1 -type d | head -1)"
          [[ -n "$BOOTCHAIN_DIR" ]] || { echo "ERROR: bootchain directory not found"; exit 1; }
          for f in devicetree.img4 trustcache.img4 ramdisk.img4 kernelcache.img4; do
            [[ -f "$BOOTCHAIN_DIR/$f" ]] || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done
          [[ -f "$BOOTCHAIN_DIR/iBoot.patched.bin" ]] && echo "OK: iBoot.patched.bin" || { echo "MISSING: iBoot.patched.bin"; exit 1; }

      - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR="$(find bootchain -mindepth 1 -maxdepth 1 -type d | head -1)"
          [[ -n "$BOOTCHAIN_DIR" ]] || { echo "ERROR: No bootchain directory found"; exit 1; }
          BUILD_NAME="$(basename "$BOOTCHAIN_DIR")"
          echo "BOOTCHAIN_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          mkdir -p artifact/bootchain
          cp -R "$BOOTCHAIN_DIR"/* artifact/bootchain/
          cat > artifact/BUILD-INFO.txt <<EOF
          Device: iPhone XS
          ProductType: iPhone11,2
          BoardConfig: D321AP
          Platform: t8020
          CPID: 0x8020
          Build: ${{ github.event.inputs.ios_version }}
          Kernel: ${{ github.event.inputs.kernel }}
          With-FW: ${{ github.event.inputs.with_fw }}
          Runner: macos-15
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          EOF
          echo "${{ github.sha }}" > artifact/source-commit.txt
          tar -czf iphone-xs-a12-ramdisk.tar.gz -C artifact .
          find artifact -type f
          du -ah artifact iphone-xs-a12-ramdisk.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xs-a12-ramdisk-${{ github.event.inputs.ios_version }}
          path: |
            artifact/
            iphone-xs-a12-ramdisk.tar.gz
          if-no-files-found: error

      - name: Restore original files
        if: always()
        run: |
          set +e
          [[ -f tools/darwin/irecovery.stock ]] && mv -f tools/darwin/irecovery.stock tools/darwin/irecovery
          [[ -f build.sh.bak ]] && mv -f build.sh.bak build.sh
          [[ -f env.sh.bak ]] && mv -f env.sh.bak env.sh

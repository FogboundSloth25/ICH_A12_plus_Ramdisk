name: Build iPhone XS A12 Ramdisk

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: "iOS version or Build ID"
        required: true
        default: "22D63"
        type: string
      kernel:
        description: "Kernel patch mode"
        required: true
        default: "patched"
        type: choice
        options:
          - patched
          - stock
      with_fw:
        description: "Include coprocessor firmware"
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -e
          echo "============================================"
          echo " iPhone XS / iPhone11,2 A12 Ramdisk Builder"
          echo "============================================"
          sw_vers
          uname -m
          echo "ProductType : iPhone11,2"
          echo "Device      : iPhone XS"
          echo "BoardConfig : D321AP"
          echo "Platform    : t8020"
          echo "CPID        : 0x8020"
          echo "iOS / Build : ${{ github.event.inputs.ios_version }}"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          brew untap aws/tap || true
          brew update
          brew install ipsw curl python@3 libpng
          which ipsw
          which python3
          ipsw version || true
          python3 --version
          echo "LIBPNG_PREFIX=$(brew --prefix libpng)" >> "$GITHUB_ENV"

      - name: Prepare x86_64 Homebrew for ibootim
        run: |
          set -euo pipefail

          softwareupdate --install-rosetta --agree-to-license || true

          if [[ "$(uname -m)" == "arm64" ]]; then
            if [[ ! -x /usr/local/bin/brew ]]; then
              echo "Installing Intel Homebrew under Rosetta..."
              NONINTERACTIVE=1 CI=1 arch -x86_64 /bin/bash -c \
                "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi

            [[ -x /usr/local/bin/brew ]] || {
              echo "ERROR: Intel Homebrew was not installed at /usr/local/bin/brew"
              exit 1
            }

            arch -x86_64 /usr/local/bin/brew update
            arch -x86_64 /usr/local/bin/brew install libpng

            X86_BREW="$(arch -x86_64 /usr/local/bin/brew --prefix)"
            X86_LIBPNG="$(arch -x86_64 /usr/local/bin/brew --prefix libpng)"
          else
            X86_BREW="$(brew --prefix)"
            X86_LIBPNG="$(brew --prefix libpng)"
          fi

          echo "X86_BREW=$X86_BREW" >> "$GITHUB_ENV"
          echo "X86_LIBPNG=$X86_LIBPNG" >> "$GITHUB_ENV"

          echo "arm64 Homebrew: $(brew --prefix)"
          echo "x86_64 Homebrew: $X86_BREW"
          echo "x86_64 libpng:   $X86_LIBPNG"
          file "$X86_LIBPNG/lib/libpng16.16.dylib"
          file tools/darwin/ibootim

      - name: Setup Python venv
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pyimg4 capstone pillow
          fi
          python - <<'PY'
          import pyimg4
          import capstone
          from PIL import Image
          print("OK: pyimg4")
          print("OK: capstone")
          print("OK: pillow")
          PY
          echo "VENV_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify repository structure
        run: |
          set -e
          for f in \
            build.sh \
            env.sh \
            scripts/devices.sh \
            scripts/ramdisk_expand.sh \
            patch/iboot_patchfinder.py \
            patch/apply_kernel_patches.py \
            patch/finalize_iboot.py \
            patch/preflight.py
          do
            [[ -f "$f" ]] || { echo "MISS: $f"; exit 1; }
            echo "OK: $f"
          done
          for r in \
            resources/IM4M_0x8020 \
            resources/ssh.tar.gz \
            resources/sshtarlist.txt \
            resources/ich_logo.png
          do
            [[ -f "$r" ]] || { echo "MISS: $r"; exit 1; }
            echo "OK: $r"
          done
          chmod +x tools/darwin/*
          for t in pzb img4 gtar trustcache jq; do
            [[ -x "tools/darwin/$t" ]] || { echo "MISS: tools/darwin/$t"; exit 1; }
            echo "OK: $t"
          done
          [[ -x tools/darwin/irecovery ]] || { echo "MISS: tools/darwin/irecovery"; exit 1; }

      - name: Patch build.sh DeviceClass matching
        run: |
          set -e
          cp build.sh build.sh.bak
          python3 <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          content = p.read_text()
          orig = 'if item.get("Info", {}).get("DeviceClass") == board'
          repl = 'if item.get("Info", {}).get("DeviceClass", "").lower() == board.lower()'
          if orig in content:
              p.write_text(content.replace(orig, repl))
              print("Patched DeviceClass comparison")
          else:
              print("DeviceClass pattern not found; leaving build.sh unchanged")
          PY
          diff -u build.sh.bak build.sh || true

      - name: Patch env.sh for CI Python
        run: |
          set -e
          cp env.sh env.sh.bak
          python3 <<'PY'
          from pathlib import Path
          p = Path("env.sh")
          content = p.read_text()
          orig = 'export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          repl = 'export PATH="${VIRTUAL_ENV:+$VIRTUAL_ENV/bin:}/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          if orig in content:
              p.write_text(content.replace(orig, repl))
              print("env.sh patched")
          else:
              print("env.sh PATH pattern not found; leaving env.sh unchanged")
          PY
          diff -u env.sh.bak env.sh || true

      - name: Validate iOS 18.3 BuildManifest remotely
        run: |
          set -e
          source .venv/bin/activate

          BUILD="${{ github.event.inputs.ios_version }}"
          [[ "$BUILD" == "22D63" ]] || {
            echo "ERROR: This workflow targets iOS 18.3 / 22D63 only."
            exit 1
          }

          WORKDIR="/tmp/buildmanifest"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          URLS="$(ipsw download ipsw --device iPhone11,2 --build "$BUILD" --urls 2>&1)"
          echo "$URLS"

          IPSW_URL="$(printf '%s\n' "$URLS" | grep -Eo 'https?://[^[:space:]]+\.ipsw' | head -1)"
          [[ -n "$IPSW_URL" ]] || {
            echo "ERROR: Could not resolve IPSW URL for iPhone11,2 / $BUILD"
            exit 1
          }
          echo "Resolved IPSW: $IPSW_URL"

          ipsw extract --remote "$IPSW_URL" --pattern '^BuildManifest\.plist$' --output .

          MANIFEST="$(find . -name BuildManifest.plist -type f | head -1)"
          [[ -n "$MANIFEST" && -f "$MANIFEST" ]] || {
            echo "ERROR: BuildManifest.plist was not extracted"
            exit 1
          }

          python3 <<'PY'
          import plistlib
          from pathlib import Path

          files = list(Path('.').rglob('BuildManifest.plist'))
          if not files:
              raise SystemExit("No BuildManifest.plist found")

          data = plistlib.loads(files[0].read_bytes())
          found = False
          for i, identity in enumerate(data.get('BuildIdentities', [])):
              info = identity.get('Info', {})
              print(
                  f"Index {i}: DeviceClass={info.get('DeviceClass', 'N/A')} "
                  f"ProductType={info.get('ProductType', 'N/A')} "
                  f"BoardConfig={info.get('BoardConfig', 'N/A')} "
                  f"BuildNumber={info.get('BuildNumber', 'N/A')} "
                  f"RestoreBehavior={info.get('RestoreBehavior', 'N/A')}"
              )
              if (
                  info.get('DeviceClass', '').lower() == 'd321ap'
                  and info.get('BuildNumber') == '22D63'
              ):
                  found = True

          if not found:
              raise SystemExit('No D321AP / 22D63 BuildIdentity found')
          print('OK: D321AP / 22D63 BuildIdentity found')
          PY

      - name: Replace irecovery with iPhone XS CI shim
        run: |
          set -e
          mv tools/darwin/irecovery tools/darwin/irecovery.stock
          cat > tools/darwin/irecovery <<'SHIM'
          #!/bin/bash
          if [[ "$1" == "-q" ]]; then
            cat <<'INNER'
          PRODUCT: iPhone11,2
          MODEL: D321AP
          CPID: 0x8020
          MODE: DFU
          PWND: usbliter8
          ECID: 0000000000000000
          NAME: iPhone XS
          INNER
            exit 0
          fi
          echo "irecovery CI shim: unsupported arguments: $*" >&2
          exit 1
          SHIM
          chmod +x tools/darwin/irecovery
          tools/darwin/irecovery -q

      - name: Build iPhone XS A12 ramdisk
        run: |
          set -e
          source .venv/bin/activate
          export PATH="$(pwd)/.venv/bin:$PATH"
          export DYLD_LIBRARY_PATH="$X86_LIBPNG/lib:${DYLD_LIBRARY_PATH:-}"
          echo "============================================"
          echo " Building iPhone XS ramdisk"
          echo "============================================"
          echo "Device      : iPhone XS"
          echo "ProductType : iPhone11,2"
          echo "BoardConfig : D321AP"
          echo "Platform    : t8020"
          echo "CPID        : 0x8020"
          echo "iOS         : 18.3"
          echo "Build       : ${{ github.event.inputs.ios_version }}"
          echo "Kernel      : ${{ github.event.inputs.kernel }}"
          echo "With FW     : ${{ github.event.inputs.with_fw }}"
          echo "x86_64 libpng: $X86_LIBPNG"
          ARGS=(
            "--device" "iPhone11,2"
            "--build" "${{ github.event.inputs.ios_version }}"
            "--kernel" "${{ github.event.inputs.kernel }}"
          )
          if [[ "${{ github.event.inputs.with_fw }}" == "true" ]]; then
            ARGS+=("--with-fw")
          else
            ARGS+=("--no-fw")
          fi
          ./build.sh "${ARGS[@]}"

      - name: Inspect bootchain
        run: |
          set -e
          find bootchain -maxdepth 2 -type f -print
          du -ah bootchain
          find bootchain -name chain.info -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true

      - name: Verify A12 bootchain
        run: |
          set -e
          BOOTCHAIN_DIR="$(find bootchain -mindepth 1 -maxdepth 1 -type d | head -1)"
          [[ -n "$BOOTCHAIN_DIR" ]] || { echo "ERROR: bootchain directory not found"; exit 1; }
          for f in devicetree.img4 trustcache.img4 ramdisk.img4 kernelcache.img4; do
            [[ -f "$BOOTCHAIN_DIR/$f" ]] || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done
          [[ -f "$BOOTCHAIN_DIR/iBoot.patched.bin" ]] || { echo "MISSING: iBoot.patched.bin"; exit 1; }
          echo "OK: iBoot.patched.bin"

      - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR="$(find bootchain -mindepth 1 -maxdepth 1 -type d | head -1)"
          [[ -n "$BOOTCHAIN_DIR" ]] || { echo "ERROR: No bootchain directory found"; exit 1; }
          BUILD_NAME="$(basename "$BOOTCHAIN_DIR")"
          echo "BOOTCHAIN_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          mkdir -p artifact/bootchain
          cp -R "$BOOTCHAIN_DIR"/* artifact/bootchain/
          cat > artifact/BUILD-INFO.txt <<EOF
          Device: iPhone XS
          ProductType: iPhone11,2
          BoardConfig: D321AP
          Platform: t8020
          CPID: 0x8020
          iOS: 18.3
          Build: ${{ github.event.inputs.ios_version }}
          Kernel: ${{ github.event.inputs.kernel }}
          With-FW: ${{ github.event.inputs.with_fw }}
          Runner: macos-15
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          EOF
          echo "${{ github.sha }}" > artifact/source-commit.txt
          tar -czf iphone-xs-a12-ramdisk-18.3.tar.gz -C artifact .
          find artifact -type f
          du -ah artifact iphone-xs-a12-ramdisk-18.3.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xs-a12-ramdisk-iOS-18.3-${{ github.event.inputs.ios_version }}
          path: |
            artifact/
            iphone-xs-a12-ramdisk-18.3.tar.gz
          if-no-files-found: error

      - name: Restore original files
        if: always()
        run: |
          set +e
          [[ -f tools/darwin/irecovery.stock ]] && mv -f tools/darwin/irecovery.stock tools/darwin/irecovery
          [[ -f build.sh.bak ]] && mv -f build.sh.bak build.sh
          [[ -f env.sh.bak ]] && mv -f env.sh.bak env.sh

name: Audit iPhone XS Ramdisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      DEVICE: iPhone11,2
      BOARD: D321AP
      BUILD: 22D63
      IOS: 18.3

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install dependencies
        shell: bash
        run: |
          set -e

          brew update

          brew install \
            python3 \
            libpng \
            libusb \
            pkg-config

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            pyimg4 \
            biplist


      - name: Setup environment
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

          python --version


      - name: Download BuildManifest
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/buildmanifest

          cd /tmp/buildmanifest

          ipsw download ipsw \
            --device "${DEVICE}" \
            --build "${BUILD}" \
            --output .

          test -f BuildManifest.plist


      - name: Print BuildManifest identities
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import plistlib

          path="/tmp/buildmanifest/BuildManifest.plist"

          with open(path,"rb") as f:
              data=plistlib.load(f)

          print("========== BUILD IDENTITIES ==========")

          for i,item in enumerate(data.get("BuildIdentities", [])):
              info=item.get("Info", {})

              print(
                  "INDEX:", i,
                  "ProductType:", info.get("ProductType"),
                  "DeviceClass:", info.get("DeviceClass"),
                  "BoardConfig:", info.get("BoardConfig"),
                  "Build:", info.get("BuildNumber")
              )

          PY


      - name: Verify target exists
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import plistlib
          import sys

          with open("/tmp/buildmanifest/BuildManifest.plist","rb") as f:
              data=plistlib.load(f)


          found=False

          for item in data.get("BuildIdentities", []):

              info=item.get("Info",{})

              if (
                  info.get("ProductType") == "iPhone11,2"
                  or info.get("BoardConfig") == "D321AP"
                  or info.get("DeviceClass","").lower() == "d321ap"
              ):
                  found=True
                  print("MATCH FOUND:")
                  print(info)
                  break


          if not found:
              print("No matching identity")
              sys.exit(1)

          PY


      - name: Install pyimg4 check
        shell: bash
        run: |
          python3 <<'PY'
          import pyimg4
          print("pyimg4 OK")
          PY


      - name: Build ramdisk
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          echo "=============================="
          echo " Building iPhone XS Ramdisk "
          echo "=============================="

          echo "Device : ${DEVICE}"
          echo "Board  : ${BOARD}"
          echo "Build  : ${BUILD}"
          echo "iOS    : ${IOS}"


          ./build.sh \
            --device "${DEVICE}" \
            --build "${BUILD}" \
            --kernel patched \
            --with-fw


      - name: Ramdisk forensic
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p forensic


          echo "=== FILE LIST ==="

          find . \
          \( \
          -name "*.img4" \
          -o -name "*.bin" \
          -o -name "*.raw" \
          \) \
          > forensic/files.txt


          echo "=== KERNEL FILES ==="

          find . \
          -iname "*kernel*" \
          -exec file {} \; \
          > forensic/kernel.txt


          echo "=== IMG4 FILES ==="

          find . \
          -name "*.img4" \
          -exec file {} \; \
          > forensic/img4.txt



      - name: Upload forensic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xs-22D63-forensic
          path: forensic/


      - name: Upload ramdisk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xs-ios18.3-22D63
          path: |
            bootchain/

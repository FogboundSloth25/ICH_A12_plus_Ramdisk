name: Audit iPhone XS A12 Ramdisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      DEVICE: iPhone11,2
      BOARD: D321AP
      BUILD: 22D63
      IOS: 18.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install \
            python3 \
            libpng \
            libusb \
            pkg-config

          python3 -m venv .venv
          source .venv/bin/activate

          pip install --upgrade pip
          pip install \
            pyimg4 \
            biplist \
            plistlib


      - name: Setup ipsw tools
        run: |
          set -e

          source .venv/bin/activate

          pip install ipsw-parser || true

          mkdir -p /tmp/buildmanifest


      - name: Download BuildManifest
        run: |
          set -e

          source .venv/bin/activate

          cd /tmp/buildmanifest

          ipsw download ipsw \
            --device "${DEVICE}" \
            --build "${BUILD}" \
            --output .


          test -f BuildManifest.plist


      - name: Debug BuildManifest identities
        run: |
          python3 <<'PY'

          import plistlib

          with open("/tmp/buildmanifest/BuildManifest.plist","rb") as f:
              data = plistlib.load(f)

          print("========== IDENTITIES ==========")

          for i,x in enumerate(data.get("BuildIdentities", [])):
              info=x.get("Info",{})

              print(
              f"""
INDEX       : {i}
ProductType : {info.get("ProductType")}
DeviceClass : {info.get("DeviceClass")}
BoardConfig : {info.get("BoardConfig")}
BuildNumber : {info.get("BuildNumber")}
Restore     : {info.get("RestoreBehavior")}
"""
              )

          PY


      - name: Patch BuildManifest matcher
        run: |
          set -e

          python3 <<'PY'

          from pathlib import Path

          p=Path("build.sh")

          if not p.exists():
              raise SystemExit("build.sh missing")

          s=p.read_text()


          old='''
identity.get("DeviceClass","").lower() == board.lower()
'''


          new='''
(
identity.get("DeviceClass","").lower() == board.lower()
or
identity.get("BoardConfig","").lower() == board.lower()
or
identity.get("ProductType","").lower() == device.lower()
)
'''


          if old in s:
              s=s.replace(old,new)
              p.write_text(s)
              print("patched BuildManifest matcher")

          else:
              print("matcher already patched or different")


          PY


      - name: Install python modules
        run: |
          python3 - <<'PY'

          import pyimg4
          print("pyimg4 OK")

          PY


      - name: Build ramdisk
        run: |
          set -e

          source .venv/bin/activate

          echo "==============================="
          echo " BUILDING RAMDISK "
          echo "==============================="

          echo "Device : ${DEVICE}"
          echo "Board  : ${BOARD}"
          echo "Build  : ${BUILD}"
          echo "iOS    : ${IOS}"


          ./build.sh \
            --device "${DEVICE}" \
            --build "${BUILD}" \
            --kernel patched \
            --with-fw


      - name: Ramdisk forensic audit
        if: always()
        run: |
          mkdir -p forensic


          echo "===== FILES ====="

          find . \
          -name "*.img4" \
          -o -name "*.bin" \
          -o -name "*.raw" \
          > forensic/files.txt || true



          echo "===== ARCH ====="

          uname -a > forensic/uname.txt
          arch >> forensic/uname.txt



          echo "===== IMG4 ====="

          find bootchain -name "*.img4" \
          -exec file {} \; \
          > forensic/img4.txt || true



          echo "===== KERNEL ====="

          find . -name "*kernel*" \
          -exec file {} \; \
          > forensic/kernel.txt || true



      - name: Upload forensic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xs-22D63-forensic
          path: forensic/


      - name: Upload ramdisk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xs-ios18.3-ramdisk
          path: |
            bootchain/
